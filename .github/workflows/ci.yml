name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  case-media:
    needs: case-media-engines
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every media engine to pass
        run: test "${{ needs['case-media-engines'].result }}" = 'success'
  case-media-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=tablet-chromium --project=mobile-chromium
          - engine: firefox
            projects: --project=media-firefox
          - engine: webkit
            projects: --project=media-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify original identities and authored media provenance
        run: node --test tests/case-media-assets.test.mjs
      - name: Install browser engines
        uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify all readers and viewer modes
        run: npm run test:e2e -- --config=playwright.media.config.ts --workers=1 ${{ matrix.projects }}
      - name: Retain media failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: case-media-${{ matrix.engine }}-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  cv-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend and server dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm run db:generate --prefix server
      - name: Install PDF inspection dependency
        run: python -m pip install PyMuPDF==1.26.4
      - name: Check static CV layout and reference
        env:
          CV_STATIC_ONLY: '1'
        run: |
          npm run test:cv --prefix server
          npm run test:cv-reference --prefix server
          node server/scripts/test-cv-overflow.mjs
  accessibility-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install additional browser engines
        uses: ./.github/actions/install-playwright
        with:
          browsers: firefox webkit
      - name: Check accessibility interactions on Firefox and WebKit
        run: npm run test:e2e -- --config=playwright.cross-browser.config.ts --workers=1
      - name: Retain engine failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-engine-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    needs: [checks, smoke-engines, profile-boundary, portrait-review-build, jobpilot-design-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require checks and every browser group to pass
        run: |
          test "${{ needs.checks.result }}" = 'success'
          test "${{ needs['smoke-engines'].result }}" = 'success'
          test "${{ needs['profile-boundary'].result }}" = 'success'
          test "${{ needs['portrait-review-build'].result }}" = 'success'
          test "${{ needs['jobpilot-design-review'].result }}" = 'success'
  jobpilot-design-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browser
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
      - name: Verify normal Production exclusion and explicit review build policy
        run: |
          node --test tests/jobpilot-design-review-build.test.mjs
          npm run build
          node scripts/assert-jobpilot-design-production-build.mjs
      - name: Verify compiled baseline and candidate journeys
        run: npm run test:e2e -- --config=playwright.jobpilot-design.config.ts --workers=1
      - name: Verify adopted JobPilot in the normal compiled build
        run: npm run test:e2e -- --config=playwright.jobpilot-production.config.ts --workers=1
      - name: Retain design review failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-design-review-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  smoke-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, tablet-chromium, mobile-chromium]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
      - name: Run existing smoke tests on one independent runner
        # Keep every test in all three configurations. Split the growing suite
        # across two runners instead of extending the 15-minute job deadline.
        run: npm run test:e2e -- --workers=1 --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --grep-invert='profile-boundary.spec.ts'
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  profile-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
      - name: Verify JobPilot boundary and engineering navigation
        run: npm run test:e2e -- tests/e2e/profile-boundary.spec.ts --workers=1
      - name: Retain boundary failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: profile-boundary-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  portrait-review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browser
        uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
      - name: Verify review opt-in and Production exclusion
        run: |
          node --test tests/profile-portrait-review-build.test.mjs
          node --test tests/profile-introduction-assets.test.mjs tests/portrait-playback.test.mjs
          npm run build
          node scripts/assert-portrait-production-build.mjs
      - name: Verify adopted Profile in the normal production build
        run: npm run test:e2e -- --config=playwright.profile-production.config.ts --project=chromium --workers=1
      - name: Verify compiled portrait and comparison
        run: npm run test:e2e -- --config=playwright.portrait-review.config.ts --project=chromium --workers=1
      - name: Retain compiled review failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-review-build-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Generate server Prisma client
        run: npm run db:generate --prefix server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test JavaScript-only API package startup
        run: npm run test:api-runtime

      - name: Test learning evidence and Capabilities integrity
        run: npm run test:integrity

      - name: Test sculpture geometry and hinge attachments
        run: npm run test:motion
