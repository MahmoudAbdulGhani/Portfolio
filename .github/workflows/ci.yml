name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cv-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend and server dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm run db:generate --prefix server
      - name: Install PDF inspection dependency
        run: python -m pip install PyMuPDF==1.26.4
      - name: Check static CV layout and reference
        env:
          CV_STATIC_ONLY: '1'
        run: |
          npm run test:cv --prefix server
          npm run test:cv-reference --prefix server
          node server/scripts/test-cv-overflow.mjs
  accessibility-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install additional browser engines
        run: npx playwright install --with-deps firefox webkit
      - name: Check accessibility interactions on Firefox and WebKit
        run: npm run test:e2e -- --config=playwright.cross-browser.config.ts --workers=1
      - name: Retain engine failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-engine-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Generate server Prisma client
        run: npm run db:generate --prefix server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test JavaScript-only API package startup
        run: npm run test:api-runtime

      - name: Test learning evidence and Capabilities integrity
        run: npm run test:integrity

      - name: Test sculpture geometry and hinge attachments
        run: npm run test:motion

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        # Keep software-rendered motion checks from competing for runner GPU/CPU.
        run: npm run test:e2e -- --workers=1

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
